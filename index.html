<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Zipcode Map</title>

    <style>
        #map-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        #map-container svg {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/zipcode_map.js"></script>
    <script src="js/redline_map.js"></script>
    <script src="js/opacity_change.js"></script>
    <!-- for percent calculations -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="js/percentageOverlap.js"></script>

    <!-- both of the maps will be held here-->
    <div id="map-container">
        <svg id="redline-map"></svg>
        <svg id="zipcode-map"></svg>

    </div>

    <script>
        drawRedlineMap(0.5);
        drawZipcodeMap(0.5);

        // TESTING: simluting events to check if the opacity changes are working as expected
        // Wait a moment so the maps finish drawing
        setTimeout(() => {
            console.log("Testing: focusing ZIPCODE map");
            document.dispatchEvent(new Event("focus-zipcode"));
        }, 1000);

        // Then switch to redline focus
        setTimeout(() => {
            console.log("Testing: focusing REDLINE map");
            document.dispatchEvent(new Event("focus-redline"));
        }, 3000);

        // Then switch back to zipcode
        setTimeout(() => {
            console.log("Testing: focusing ZIPCODE map again");
            document.dispatchEvent(new Event("focus-zipcode"));
        }, 5000);
    </script>
    

</body>

</html>
