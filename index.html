<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Map Composition</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .map-section {
            flex: 1;
        }

        .layers-section {
            width: 350px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }

        #map-container {
            position: relative;
            width: 100%;
            height: 600px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        #map-container svg {
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        #redline-map path.selected {
            stroke: black;
            stroke-width: 3px;
            filter: brightness(1.3);
            filter: drop-shadow(0 0 6px black);
        }

        #zipcode-map path.selected {
            stroke: black;
            stroke-width: 3px;
            filter: drop-shadow(0 0 6px black);
        }

        .layers-list {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .layer-item:last-child {
            margin-bottom: 0;
        }

        .layer-item button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }

        .layer-item button:hover {
            color: #333;
        }

        .layer-name {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .layer-item input[type="checkbox"],
        .layer-item input[type="radio"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .layer-item button:hover {
            color: #333;
        }

        .layer-name {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .layer-item input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .site-footer {
            width: 100%;
            padding: 15px 0;
            background-color: #111;
            text-align: center;
            margin-top: 50px;
        }

        .site-footer a {
            color: white;
            text-decoration: none;
            margin: 0 30px;
            font-weight: 500;
        }

        .site-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>


<body>
    <h1>Explore The Impact of Historic Redlining on Worcester</h1>

    <div class="container">
        <div class="map-section">
            <h2>Map</h2>
            <div id="map-container">
                <svg id="redline-map"></svg>
                <svg id="zipcode-map"></svg>
            </div>
        </div>

        <div class="layers-section">
            <h2>Select a map to focus</h2>
            <div class="layers-list" id="layers-list"></div>

            <!-- Redline details (shows ONLY when redline is focused) -->
            <div id="redline-details" style="
            margin-top: 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.35;
            display: none;
        ">
                <div style="font-weight:700; margin-bottom:6px;text-align:center;">Redline Map</div>
                <div id="redline-zone-info">Click a redlining zone to see details.</div>
            </div>

            <!--Zipcode details -->
            <div id="zipcode-details" style="
            margin-top: 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.35;
            display: none;
        ">
                <div style="font-weight: 700; margin-bottom:6px; text-align:center;">Zipcode Map</div>
                <div id="zip"></div>
                <div id="zipcode-redline-breakdown" style="margin-top:10px;"></div>
                <div id="zipcode-zone-info">Click a zipcode zone to see details.</div>
                <div id="zipcode-demographics-chart" style="margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <!-- D3 scripts -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/map_projection.js"></script>
    <script src="js/zipcode_map.js"></script>
    <script src="js/redline_map.js"></script>
    <script src="js/opacity_change.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="js/percentageOverlap.js"></script>
    <script src="js/zip_demographics_chart.js"></script>
    <script src="js/breakdown_graph.js"></script>

    <script>
        // Application state
        const appState = {
            maps: [
                { id: 1, name: 'Redline Map', visible: true, opacity: 0.5, svgId: 'redline-map' },
                { id: 2, name: 'Zipcode Map', visible: true, opacity: 0.5, svgId: 'zipcode-map' }
            ]
        };

        // Track which map is currently focused
        let focusedMap = "redline"; // default matches your initial radio check

        function setDetailsVisibility() {
            const redlineDetailsBox = document.getElementById("redline-details");
            const zipcodeDetailsBox = document.getElementById("zipcode-details");

            if (redlineDetailsBox) {
                redlineDetailsBox.style.display = (focusedMap === "redline") ? "block" : "none";
            }
            if (zipcodeDetailsBox) {
                zipcodeDetailsBox.style.display = (focusedMap === "zipcode") ? "block" : "none";
            }
        }

        // Update focus when radios change (you already dispatch these events)
        document.addEventListener("focus-redline", () => {
            focusedMap = "redline";
            setDetailsVisibility();
        });

        document.addEventListener("focus-zipcode", () => {
            focusedMap = "zipcode";
            setDetailsVisibility();
        });

        // Only update the redline info box if redline is focused
        document.addEventListener("redline-clicked", (e) => {
            if (focusedMap !== "redline") return;

            const info = e.detail;
            console.log("info", info);
            const panel = document.getElementById("redline-zone-info");
            if (!panel) return;

            panel.innerHTML = `
        <div style="font-weight:700; margin-bottom:6px;">
            Zone ${info.redLineNum} - ${info.zoneColor}: ${info.zoneCategory}
        </div>

        <div style="font-weight:600;">
            Zone description as written in 1936:
        </div>

        <div style="margin-bottom:10px;">
            ${info.description || "No description available."}
        </div>

        `;
        });
        // additional zipcode side panel logic
        document.addEventListener("zipcode-clicked", (e) => {
            if (focusedMap !== "zipcode") return;

            const info = e.detail;
            console.log("zipcode info", info);
            const panel = document.getElementById("zipcode-zone-info");
            if (!panel) return;

            const zipPanel = document.getElementById("zip");
            if (zipPanel) {
                zipPanel.textContent = `Zipcode: ${info.zipCode}`;
            }

            panel.innerHTML = `

            <div style="margin-bottom:6px;">
                <span style="font-weight:600;">Median Housing Price:</span>
                <span>${info.medianHousePrice ? `$${info.medianHousePrice}` : "N/A"}</span>
            </div>

            <div style="margin-bottom:6px;">
                <span style="font-weight:600;">Median Income:</span>
                <span>${info.medianIncome ? `$${info.medianIncome}` : "N/A"}</span>
            </div>
        `;
            if (window.renderZipDemographicsChart) {
                window.renderZipDemographicsChart(info.zipCode);
            }

            const panel3 = document.getElementById("zipcode-redline-breakdown");

            if (panel3) {

                // Create container for chart
                panel3.innerHTML = `
                    <div style="font-weight:600; margin-bottom:6px;">
                        Redlining Breakdown:
                    </div>

                    <div id="zip-redlining-chart-container"></div>
                `;

                // render chart
                renderZipRedliningChart(info.zipCode);
            }
        });

        // Initialize layers panel
        function renderLayers() {
            const layersList = document.getElementById('layers-list');
            layersList.innerHTML = '';

            // build a simple either/or radio group that triggers focus events
            appState.maps.forEach(map => {
                const layerItem = document.createElement('div');
                layerItem.className = 'layer-item';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'map-focus';
                radio.value = map.id;
                radio.dataset.event = map.id === 1 ? 'focus-redline' : 'focus-zipcode';

                // default focus to the first map
                if (map.id === 1) radio.checked = true;

                const name = document.createElement('span');
                name.className = 'layer-name';
                name.textContent = map.name;

                layerItem.appendChild(radio);
                layerItem.appendChild(name);
                layersList.appendChild(layerItem);
            });

            document.querySelectorAll('input[name="map-focus"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    if (radio.checked) {
                        document.dispatchEvent(new Event(radio.dataset.event));
                    }
                });
            });
        }

        // Initialize maps
        function initializeMaps() {
            setTimeout(() => {
                if (window.drawRedlineMap) {
                    drawRedlineMap(appState.maps[0].opacity);
                }
                if (window.drawZipcodeMap) {
                    drawZipcodeMap(appState.maps[1].opacity);
                }
            }, 100);
        }

        // adding zoom and pan to maps
        function enableZoom() {
            const redlineLayer = d3.select("#redline-map .zoom-layer");
            const zipcodeLayer = d3.select("#zipcode-map .zoom-layer");

            const zoom = d3.zoom()
                .scaleExtent([1, 8])
                .on("zoom", (event) => {
                    redlineLayer.attr("transform", event.transform);
                    zipcodeLayer.attr("transform", event.transform);
                });

            d3.select("#map-container")
                .call(zoom);
        }

        // Start the app
        renderLayers();
        //initializeMaps();
        Promise.all([
            drawRedlineMap(appState.maps[0].opacity),
            drawZipcodeMap(appState.maps[1].opacity)
        ]).then(() => {
            enableZoom(); // now both zoom-layer groups exist
        });

        // Show the correct details state on first load
        setDetailsVisibility();

        setTimeout(enableZoom, 300); // enable zoom after a short delay to ensure maps are rendered

        // fire initial focus event so the default radio selection is respected
        document.dispatchEvent(new Event('focus-redline'));
    </script>

    <!-- adding a footer with further resources -->
    <footer class="site-footer">
        <a href="https://en.wikipedia.org/wiki/Redlining" target="_blank">
            What is Redlining?
        </a>

        <a href="https://gis.data.mass.gov/datasets/worcesterma::historic-redlining-zones/about" target="_blank">
            Worcester Redlining History and Data
        </a>

        <a href="https://drive.google.com/file/d/1u-6lays6OiPB_vpxqdn8oxjUh9Bh-r59/view?usp=sharing" target="_blank">
            Process Book
        </a>
    </footer>

</body>

</html>
